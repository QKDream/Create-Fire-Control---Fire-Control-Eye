[[dependencies.firecontrolcompat]]
    modId="create_fire_control"
  # Lower bound is 0.9.4: everything below it lacks the 0.9.4 API this build relies on
  # (mathematical missile manager, reworked radar HUD, split aircraft/ground weapon types).
  # No upper bound on purpose - the 1.0.x line was audited member by member
  # (_work/audit_compat_100.py, _work/fc_094_vs_100.txt) and keeps every symbol we touch.
    versionRange="[0.9.4,)"
    ordering="AFTER"
    side="BOTH"

